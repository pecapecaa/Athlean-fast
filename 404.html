<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stranica nije pronađena - Hercz Wines</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: linear-gradient(160deg, #1f0508 0%, #3d1015 100%);
      color: #f5ede0;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    .code {
      font-family: 'Cinzel', serif;
      font-size: clamp(4rem, 18vw, 8rem);
      font-weight: 900;
      color: #c9a961;
      line-height: 1;
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 18px 0 12px;
    }
    p { font-size: 1.15rem; font-style: italic; opacity: 0.75; margin-bottom: 32px; }
    a {
      display: inline-block;
      padding: 14px 34px;
      background: #c9a961;
      color: #1f0508;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 4px;
      transition: background 0.25s;
    }
    a:hover { background: #e0c078; }
    .rule { width: 60px; height: 1px; background: #c9a961; margin: 0 auto 22px; opacity: 0.5; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Stranica nije pronađena</h1>
    <div class="rule"></div>
    <p>Izgleda da je ova flaša već otvorena.</p>
    <a href="/">Nazad na početnu</a>
  </main>
</body>
</html>
