<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stranica nije pronađena | AthLean Fast</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 60% 50% at 50% 35%, rgba(47, 85, 255, 0.35) 0%, transparent 70%),
        repeating-linear-gradient(-35deg, rgba(255, 255, 255, 0.025) 0 2px, transparent 2px 28px),
        linear-gradient(180deg, #070a1c 0%, #050506 80%);
      color: #f2f3f7;
      font-family: 'Lato', Arial, sans-serif;
    }
    .mark { width: 110px; height: auto; margin: 0 auto 18px; display: block; }
    .code {
      font-family: 'Montserrat', 'Arial Black', sans-serif;
      font-size: clamp(5rem, 22vw, 9rem);
      font-weight: 900;
      line-height: 1;
      color: #6f8bff;
    }
    h1 {
      font-family: 'Montserrat', 'Arial Black', sans-serif;
      font-size: clamp(1.3rem, 5vw, 2rem);
      font-weight: 800;
      text-transform: uppercase;
      margin: 12px 0 10px;
    }
    p { font-size: 1.1rem; color: rgba(242, 243, 247, 0.7); margin-bottom: 32px; }
    a {
      display: inline-block;
      padding: 16px 34px;
      border-radius: 999px;
      background: #2f55ff;
      color: #ffffff;
      text-decoration: none;
      font-family: 'Montserrat', 'Arial Black', sans-serif;
      font-size: 0.86rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      transition: background 0.25s;
    }
    a:hover { background: #4a6bff; }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="images/logo-mark.svg" alt="AthLean Fast">
    <div class="code">404</div>
    <h1>Stranica nije pronađena</h1>
    <p>Ova vježba nije u planu. Vrati se na početak i kreni ispočetka.</p>
    <a href="./">Nazad na početnu</a>
  </main>
</body>
</html>
