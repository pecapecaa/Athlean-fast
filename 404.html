<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stranica nije pronađena | AthLean Fast</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 55% 45% at 50% 38%, rgba(23, 57, 196, 0.5) 0%, transparent 70%),
        linear-gradient(180deg, #011244 0%, #0a0a0b 100%);
      color: #f3f4f6;
      font-family: 'Lato', Arial, sans-serif;
    }
    .mark { width: 96px; height: auto; margin: 0 auto 18px; display: block; }
    .code {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: clamp(5rem, 22vw, 9rem);
      font-weight: 400;
      line-height: 1;
      color: #3b5fe0;
    }
    h1 {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: clamp(1.5rem, 6vw, 2.4rem);
      font-weight: 400;
      text-transform: uppercase;
      margin: 12px 0 10px;
    }
    p { font-size: 1.1rem; color: rgba(243, 244, 246, 0.7); margin-bottom: 32px; }
    a {
      display: inline-block;
      padding: 16px 44px;
      border-radius: 999px;
      background: #1739c4;
      color: #ffffff;
      text-decoration: none;
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: background 0.25s;
    }
    a:hover { background: #2448d6; }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="images/logo-mark.svg" alt="AthLean Fast">
    <div class="code">404</div>
    <h1>Stranica nije pronađena</h1>
    <p>Ova vježba nije u planu. Link je možda zastario.</p>
    <a href="./">Nazad na početnu</a>
  </main>
</body>
</html>
