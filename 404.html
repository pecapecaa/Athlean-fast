<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stranica nije pronađena | AthLean Fast</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 80% 20%, rgba(255, 90, 31, 0.25) 0%, transparent 55%),
        repeating-linear-gradient(-35deg, rgba(255, 255, 255, 0.03) 0 2px, transparent 2px 26px),
        linear-gradient(160deg, #1b1f26 0%, #0d0f12 70%);
      color: #f4f4f1;
      font-family: 'Lato', Arial, sans-serif;
    }
    .code {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: clamp(5rem, 22vw, 10rem);
      font-weight: 700;
      font-style: italic;
      line-height: 1;
      color: #ff5a1f;
    }
    h1 {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 12px 0 10px;
    }
    p { font-size: 1.1rem; color: rgba(244, 244, 241, 0.7); margin-bottom: 32px; }
    a {
      display: inline-block;
      padding: 15px 34px;
      background: #ff5a1f;
      color: #0d0f12;
      text-decoration: none;
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: background 0.25s;
    }
    a:hover { background: #ff7744; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Stranica nije pronađena</h1>
    <p>Ova vježba nije u planu. Vrati se na početak i kreni ispočetka.</p>
    <a href="./">Nazad na početnu</a>
  </main>
</body>
</html>
