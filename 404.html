<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stranica nije pronađena | AthLean Fast</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@1,400&family=Lato:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 30% 40%, rgba(209, 168, 90, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 60%, rgba(42, 75, 215, 0.4) 0%, transparent 55%),
        linear-gradient(135deg, #04060e 0%, #0b1340 45%, #1b2f8a 100%);
      color: #ffffff;
      font-family: 'Lato', Arial, sans-serif;
    }
    .mark { width: 92px; height: auto; margin: 0 auto 18px; display: block; }
    .code {
      font-family: 'Cinzel', Georgia, serif;
      font-size: clamp(4.5rem, 20vw, 8rem);
      font-weight: 700;
      letter-spacing: 6px;
      line-height: 1;
      color: #d1a85a;
    }
    /* Cinzel draws Đ/đ as a D with a macron; this title has an đ, so it
       stays in the sans. */
    h1 {
      font-family: 'Lato', Arial, sans-serif;
      font-size: clamp(0.95rem, 3.5vw, 1.15rem);
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin: 16px 0 12px;
    }
    p {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.3rem;
      font-style: italic;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 32px;
    }
    a {
      display: inline-block;
      padding: 14px 36px;
      border: 2px solid #2a4bd7;
      background: #2a4bd7;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: background 0.3s, border-color 0.3s;
    }
    a:hover { background: #3a5ce6; border-color: #3a5ce6; }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="images/logo-mark.svg" alt="AthLean Fast">
    <div class="code">404</div>
    <h1>Stranica nije pronađena</h1>
    <p>Ova vježba nije u planu. Vrati se na početak i kreni ispočetka.</p>
    <a href="./">Nazad na početnu</a>
  </main>
</body>
</html>
